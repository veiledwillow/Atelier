<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Atelier Trace Studio</title>

  <link rel="manifest" href="manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* 1. EMERALD & GOLD */
    :root[data-theme="emerald"] {
      --bg-deep: #050d09;
      --bg-surface: #0a1711;
      --bg-surface-elevated: #0f2118;
      --border-soft: rgba(212, 175, 55, 0.22);
      --border-bright: rgba(212, 175, 55, 0.55);
      --accent-prime: #d4af37;
      --accent-glow: rgba(212, 175, 55, 0.35);
      --accent-gradient: linear-gradient(135deg, #f7e089 0%, #d4af37 50%, #aa8210 100%);
      --accent-text: #f9e7a2;
      --text-main: #f4f6f4;
      --text-muted: #8fa597;
      --glass-panel: rgba(10, 23, 17, 0.94);
      --guide-stroke: #d4af37;
      --canvas-light-bg: #ffffff;
      --vector-color: #1a241e;
      --select-arrow: url('data:image/svg+xml;utf8,<svg fill="%23d4af37" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      --btn-primary-text: #0d1a12;
    }

    /* 2. SAPPHIRE & COPPER */
    :root[data-theme="sapphire"] {
      --bg-deep: #050b16;
      --bg-surface: #0a1324;
      --bg-surface-elevated: #0f1c36;
      --border-soft: rgba(217, 131, 78, 0.25);
      --border-bright: rgba(217, 131, 78, 0.6);
      --accent-prime: #d9834e;
      --accent-glow: rgba(217, 131, 78, 0.35);
      --accent-gradient: linear-gradient(135deg, #f7aa7c 0%, #d9834e 50%, #9e4b1e 100%);
      --accent-text: #fddbc7;
      --text-main: #f0f4fc;
      --text-muted: #8294b5;
      --glass-panel: rgba(10, 19, 36, 0.94);
      --guide-stroke: #d9834e;
      --canvas-light-bg: #ffffff;
      --vector-color: #101c30;
      --select-arrow: url('data:image/svg+xml;utf8,<svg fill="%23d9834e" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      --btn-primary-text: #07101f;
    }

    /* 3. OBSIDIAN & PLATINUM */
    :root[data-theme="obsidian"] {
      --bg-deep: #08090a;
      --bg-surface: #101216;
      --bg-surface-elevated: #1a1d23;
      --border-soft: rgba(226, 232, 240, 0.22);
      --border-bright: rgba(226, 232, 240, 0.55);
      --accent-prime: #e2e8f0;
      --accent-glow: rgba(226, 232, 240, 0.32);
      --accent-gradient: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
      --accent-text: #ffffff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-panel: rgba(16, 18, 22, 0.94);
      --guide-stroke: #cbd5e1;
      --canvas-light-bg: #ffffff;
      --vector-color: #121418;
      --select-arrow: url('data:image/svg+xml;utf8,<svg fill="%23cbd5e1" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      --btn-primary-text: #0b0f14;
    }

    /* 4. PLUM VELVET & ROSE GOLD */
    :root[data-theme="plum"] {
      --bg-deep: #0f050d;
      --bg-surface: #1a0a17;
      --bg-surface-elevated: #260e22;
      --border-soft: rgba(234, 160, 169, 0.25);
      --border-bright: rgba(234, 160, 169, 0.6);
      --accent-prime: #eaa0a9;
      --accent-glow: rgba(234, 160, 169, 0.35);
      --accent-gradient: linear-gradient(135deg, #fad0d6 0%, #eaa0a9 50%, #b86273 100%);
      --accent-text: #ffe4e8;
      --text-main: #fcf4f6;
      --text-muted: #b58d99;
      --glass-panel: rgba(26, 10, 23, 0.94);
      --guide-stroke: #eaa0a9;
      --canvas-light-bg: #ffffff;
      --vector-color: #241021;
      --select-arrow: url('data:image/svg+xml;utf8,<svg fill="%23eaa0a9" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      --btn-primary-text: #1d071a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    header {
      height: 50px;
      padding: 0 14px;
      background: var(--glass-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-soft);
      color: var(--text-muted);
      height: 30px;
      padding: 0 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover, .icon-btn.active {
      color: var(--accent-text);
      border-color: var(--accent-prime);
      background: rgba(255, 255, 255, 0.08);
    }

    #stage-container {
      flex: 1;
      position: relative;
      background: var(--canvas-light-bg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease;
    }

    #stage-container.dark-mode {
      background: #000000;
    }

    #stage-container.dark-mode #vector-preset {
      color: #f1f5f9 !important;
    }

    #nail-guide-wrapper {
      position: absolute;
      pointer-events: none;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #nail-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.35));
    }

    #nail-path {
      stroke: var(--guide-stroke);
      stroke-width: 2.2;
      stroke-dasharray: 4 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s ease;
    }

    #image-stage {
      position: absolute;
      touch-action: none;
      cursor: grab;
      transform-origin: center center;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #trace-img {
      display: none;
      max-width: 320px;
      pointer-events: none;
    }

    #vector-preset {
      display: none;
      pointer-events: none;
      width: 260px;
      height: 380px;
      color: var(--vector-color);
      transition: color 0.3s ease;
    }

    #touch-guard {
      display: none;
      position: absolute;
      inset: 0;
      background: transparent;
      z-index: 50;
    }

    #lock-banner {
      display: none;
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 60;
    }

    #unlock-btn {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--accent-prime);
      color: var(--accent-text);
      box-shadow: 0 8px 24px var(--accent-glow);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #control-deck {
      background: var(--glass-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-soft);
      padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 30;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.4);
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .btn {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-soft);
      height: 36px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      white-space: nowrap;
      padding: 0 4px;
      transition: all 0.2s ease;
    }

    .btn:active {
      transform: scale(0.97);
      border-color: var(--accent-prime);
    }

    .btn.primary {
      background: var(--accent-gradient);
      color: var(--btn-primary-text);
      border: none;
      font-weight: 700;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    select.btn {
      appearance: none;
      -webkit-appearance: none;
      padding: 0 16px 0 8px;
      background-image: var(--select-arrow);
      background-repeat: no-repeat;
      background-position: right 4px center;
      text-align-last: center;
    }

    .slider-tabs {
      display: flex;
      gap: 8px;
      padding: 2px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      border: 1px solid var(--border-soft);
    }

    .tab-btn {
      flex: 1;
      height: 28px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--bg-surface-elevated);
      color: var(--accent-text);
      border: 1px solid var(--accent-prime);
    }

    .slider-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      border: 1px solid var(--border-soft);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      min-width: 60px;
    }

    input[type="range"] {
      flex: 1;
      height: 32px;
      background: transparent;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: var(--accent-gradient);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      margin-top: -9px;
      border: 2px solid var(--bg-deep);
    }

    input[type="range"]::-moz-range-track {
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
    }

    input[type="range"]::-moz-range-thumb {
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: var(--accent-gradient);
      border: 2px solid var(--bg-deep);
    }
  </style>
</head>
<body>

  <header id="main-header">
    <div class="brand-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      Atelier Trace
    </div>

    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle" title="Cycle Palette">
        <span id="theme-name">✦ Emerald & Gold</span>
      </button>

      <button class="icon-btn" id="bg-toggle" title="Light / Dark Stage">
        <span id="bg-label">☼ Light</span>
      </button>
    </div>
  </header>

  <main id="stage-container">
    <div id="touch-guard"></div>

    <div id="lock-banner">
      <button id="unlock-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        Studio Locked • Tap to Release
      </button>
    </div>

    <div id="nail-guide-wrapper" style="width: 140px; height: 260px;">
      <svg id="nail-svg" viewBox="0 0 100 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path id="nail-path" d="" />
      </svg>
    </div>

    <div id="image-stage">
      <img id="trace-img" src="" alt="Custom trace reference" crossorigin="anonymous" />
      <svg id="vector-preset" viewBox="0 0 100 200" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"></svg>
    </div>
  </main>

  <footer id="control-deck">
    <div class="button-grid">
      <label class="btn" style="grid-column: span 1;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:3px;">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        Load
        <input type="file" id="file-input" accept="image/*" style="display:none;" />
      </label>

      <select id="shape-select" class="btn" style="grid-column: span 1;">
        <option value="almond">Almond</option>
        <option value="coffin">Coffin</option>
        <option value="stiletto">Stiletto</option>
        <option value="square">Square</option>
        <option value="squoval">Squoval</option>
        <option value="oval">Oval</option>
        <option value="none">No Guide</option>
      </select>

      <select id="preset-select" class="btn" style="grid-column: span 1;">
        <option value="none">Presets...</option>
        <option value="stained_glass">Stained Glass Sheet</option>
        <option value="rose">Wild Gothic Rose</option>
        <option value="baroque">Baroque Filigree Crown</option>
        <option value="celestial">Celestial Sun & Moon</option>
        <option value="botanical">Bespoke Botanical Vine</option>
        <option value="sacred">Sacred Heart & Dagger</option>
        <option value="cyber">Tribal Chrome Cyber</option>
      </select>

      <button class="btn" id="flip-h" title="Flip Horizontal">↔ Flip</button>
      <button class="btn" id="flip-v" title="Flip Vertical">↕ Invert</button>

      <button class="btn primary" id="lock-btn">🔒 Lock</button>
    </div>

    <!-- CLEAN TWO-TAB SYSTEM FOR SLIDERS -->
    <div class="slider-tabs">
      <button class="tab-btn active" id="tab-art">Artwork Sliders</button>
      <button class="tab-btn" id="tab-guide">Nail Guide Sliders</button>
    </div>

    <div class="slider-panel" id="panel-art">
      <div class="slider-row">
        <span class="slider-label">Zoom</span>
        <input type="range" id="scale-slider" min="0.1" max="6" step="0.05" value="1" />
      </div>
      <div class="slider-row">
        <span class="slider-label">Opacity</span>
        <input type="range" id="opacity-slider" min="0.1" max="1" step="0.05" value="1" />
      </div>
    </div>

    <div class="slider-panel" id="panel-guide" style="display: none;">
      <div class="slider-row">
        <span class="slider-label">Length</span>
        <input type="range" id="length-slider" min="70" max="480" step="5" value="260" />
      </div>
      <div class="slider-row">
        <span class="slider-label">Width</span>
        <input type="range" id="width-slider" min="35" max="280" step="2" value="140" />
      </div>
    </div>
  </footer>

  <script>
    const NAIL_PATHS = {
      almond: "M 20,165 C 20,185 80,185 80,165 C 80,115 72,55 50,10 C 28,55 20,115 20,165 Z",
      coffin: "M 20,165 C 20,185 80,185 80,165 C 80,110 74,45 64,12 L 36,12 C 26,45 20,110 20,165 Z",
      stiletto: "M 20,165 C 20,185 80,185 80,165 C 80,105 68,45 50,4 C 32,45 20,105 20,165 Z",
      square: "M 18,165 C 18,185 82,185 82,165 L 82,12 L 18,12 Z",
      squoval: "M 20,165 C 20,185 80,185 80,165 L 80,24 C 80,12 68,12 50,12 C 32,12 20,12 20,24 Z",
      oval: "M 20,165 C 20,185 80,185 80,165 C 80,95 80,12 50,12 C 20,12 20,95 20,165 Z"
    };

    // BESPOKE SALON-GRADE VECTOR ART FOR FULL-BED TRACING
    const PRESETS = {
      rose: `
        <!-- Heart of the Rose Bloom -->
        <path d="M 50,70 C 44,64 45,55 52,56 C 58,57 60,67 50,72 C 40,77 36,65 42,52 C 49,43 65,48 64,66 C 63,80 43,84 34,70 C 26,57 37,38 52,38 C 69,38 78,56 72,76 C 66,94 40,96 30,82 C 20,68 28,45 42,32 C 58,19 82,32 80,60 C 78,92 48,105 32,95 C 18,85 18,52 35,30 C 52,10 82,18 88,48 C 94,76 74,108 50,114" fill="none"/>
        <!-- Rose Calyx & Stem -->
        <path d="M 50,114 C 48,135 53,165 48,195" fill="none" stroke-width="2.8"/>
        <!-- Thorny Accents -->
        <path d="M 50,132 Q 58,128 62,132" fill="none"/>
        <path d="M 49,158 Q 41,154 38,158" fill="none"/>
        <path d="M 49,178 Q 57,175 60,180" fill="none"/>
        <!-- Detailed Botanical Leaves -->
        <path d="M 50,138 C 65,130 82,135 84,150 C 72,154 58,146 50,138 Z" fill="none"/>
        <path d="M 50,138 Q 68,143 84,150" fill="none" stroke-width="1.2"/>
        <path d="M 49,164 C 32,156 16,162 14,178 C 28,181 42,172 49,164 Z" fill="none"/>
        <path d="M 49,164 Q 30,170 14,178" fill="none" stroke-width="1.2"/>
      `,
      baroque: `
        <!-- Crown Apex Tiara -->
        <circle cx="50" cy="18" r="3.5" fill="currentColor"/>
        <path d="M 50,22 L 50,38 M 42,30 L 58,30" fill="none"/>
        <path d="M 50,38 C 65,22 84,32 78,50 C 72,66 56,66 50,80 C 44,66 28,66 22,50 C 16,32 35,22 50,38 Z" fill="none"/>
        <circle cx="50" cy="52" r="4.5" fill="none"/>
        <!-- Center Gemstone Shield -->
        <polygon points="50,92 68,110 50,140 32,110" fill="none"/>
        <polygon points="50,100 62,112 50,130 38,112" fill="none" stroke-dasharray="2 2"/>
        <!-- Flanking Baroque Arabesques -->
        <path d="M 32,110 C 18,105 10,122 18,136 C 26,148 40,138 48,152 C 50,165 44,185 50,195 C 56,185 50,165 52,152 C 60,138 74,148 82,136 C 90,122 82,105 68,110" fill="none"/>
        <!-- Flourish Droplets -->
        <circle cx="50" cy="165" r="2.5" fill="currentColor"/>
        <circle cx="50" cy="182" r="1.8" fill="currentColor"/>
      `,
      celestial: `
        <!-- Crescent Moon Arch -->
        <path d="M 58,35 A 36 36 0 1 0 58,115 A 28 28 0 1 1 58,35 Z" fill="none" stroke-width="2.6"/>
        <!-- Central Sunburst Core -->
        <circle cx="48" cy="75" r="8" fill="none"/>
        <circle cx="48" cy="75" r="3" fill="currentColor"/>
        <!-- Radiating Star Rays -->
        <line x1="48" y1="52" x2="48" y2="62"/>
        <line x1="48" y1="88" x2="48" y2="98"/>
        <line x1="25" y1="75" x2="35" y2="75"/>
        <line x1="61" y1="75" x2="71" y2="75"/>
        <!-- Major North Celestial Star -->
        <path d="M 50,130 Q 50,148 38,148 Q 50,148 50,166 Q 50,148 62,148 Q 50,148 50,130 Z" fill="none"/>
        <!-- Minor Trailing Stars -->
        <path d="M 30,30 Q 30,38 24,38 Q 30,38 30,46 Q 30,38 36,38 Q 30,38 30,30 Z" fill="none"/>
        <circle cx="75" cy="45" r="1.8" fill="currentColor"/>
        <circle cx="25" cy="115" r="1.5" fill="currentColor"/>
        <circle cx="68" cy="140" r="1.8" fill="currentColor"/>
        <!-- Draped Astral Beading -->
        <path d="M 28,175 Q 50,190 72,175" fill="none" stroke-dasharray="2 3"/>
      `,
      botanical: `
        <!-- Graceful Central Stem -->
        <path d="M 50,195 C 44,145 60,85 48,15" fill="none" stroke-width="2.5"/>
        <!-- Lower Leaf Pair -->
        <path d="M 48,165 C 28,162 20,148 24,136 C 36,134 46,146 48,155" fill="none"/>
        <path d="M 50,150 C 70,145 78,130 74,120 C 62,120 52,134 50,142" fill="none"/>
        <!-- Mid-Bed Foliage -->
        <path d="M 49,122 C 26,118 18,102 24,90 C 36,90 46,104 49,112" fill="none"/>
        <path d="M 52,108 C 74,100 80,85 76,72 C 64,74 54,88 52,98" fill="none"/>
        <!-- Delicate Tip Tendrils & Buds -->
        <path d="M 49,78 C 30,72 25,58 32,48 C 42,50 48,62 49,70" fill="none"/>
        <path d="M 51,64 C 68,54 70,42 64,34 C 54,38 51,50 51,56" fill="none"/>
        <circle cx="48" cy="14" r="2.5" fill="currentColor"/>
      `,
      sacred: `
        <!-- Piercing Stiletto Dagger -->
        <path d="M 50,10 L 54,40 L 50,190 L 46,40 Z" fill="none" stroke-width="2.5"/>
        <line x1="32" y1="35" x2="68" y2="35" stroke-width="3"/>
        <circle cx="50" cy="16" r="4" fill="currentColor"/>
        <!-- Sacred Heart Curves -->
        <path d="M 50,75 C 34,50 14,70 26,98 C 36,118 48,135 50,145 C 52,135 64,118 74,98 C 86,70 66,50 50,75 Z" fill="none" stroke-width="2.5"/>
        <!-- Radiating Aura Halos -->
        <path d="M 28,65 Q 16,85 22,112" fill="none" stroke-dasharray="3 3"/>
        <path d="M 72,65 Q 84,85 78,112" fill="none" stroke-dasharray="3 3"/>
        <!-- Crown of Thorns Wrap -->
        <path d="M 28,95 Q 50,110 72,95" fill="none" stroke-width="2"/>
        <path d="M 38,98 L 34,104 M 62,98 L 66,104" fill="none"/>
      `,
      cyber: `
        <!-- Y2K Neo-Tribal Chrome Flame -->
        <path d="M 50,12 C 55,42 68,52 64,72 C 60,90 42,88 50,112 C 56,128 72,130 68,155 C 64,178 54,185 50,195 C 46,185 36,178 32,155 C 28,130 44,128 50,112 C 58,88 40,90 36,72 C 32,52 45,42 50,12 Z" fill="none" stroke-width="2.6"/>
        <!-- Flanking Razor Barbs -->
        <path d="M 62,65 Q 82,72 86,55 Q 74,85 58,95" fill="none"/>
        <path d="M 38,65 Q 18,72 14,55 Q 26,85 42,95" fill="none"/>
        <path d="M 64,120 Q 86,130 88,112 Q 76,145 56,155" fill="none"/>
        <path d="M 36,120 Q 14,130 12,112 Q 24,145 44,155" fill="none"/>
        <!-- Core Diamond Piercing -->
        <polygon points="50,92 56,106 50,120 44,106" fill="currentColor"/>
      `
    };

    const THEMES = [
      { id: 'emerald', label: '✦ Emerald & Gold' },
      { id: 'sapphire', label: '✦ Sapphire & Copper' },
      { id: 'obsidian', label: '✦ Obsidian & Platinum' },
      { id: 'plum', label: '✦ Plum & Rose Gold' }
    ];
    let currentThemeIndex = 0;

    const STAINED_GLASS_SOURCES = [
      './6f7eeb5b-a027-4abb-9325-7d676ca60f8d.png',
      './stained-glass.png',
      'https://i.ibb.co/3sBshfS/stained-glass-nails.png'
    ];

    const root = document.documentElement;
    const themeBtn = document.getElementById('theme-toggle');
    const themeName = document.getElementById('theme-name');
    const bgBtn = document.getElementById('bg-toggle');
    const bgLabel = document.getElementById('bg-label');
    const stage = document.getElementById('stage-container');
    const touchGuard = document.getElementById('touch-guard');
    const lockBanner = document.getElementById('lock-banner');
    const lockBtn = document.getElementById('lock-btn');
    const unlockBtn = document.getElementById('unlock-btn');
    const mainHeader = document.getElementById('main-header');
    const controlDeck = document.getElementById('control-deck');

    const nailSvg = document.getElementById('nail-svg');
    const nailPath = document.getElementById('nail-path');
    const guideWrapper = document.getElementById('nail-guide-wrapper');
    const shapeSelect = document.getElementById('shape-select');

    const fileInput = document.getElementById('file-input');
    const imgStage = document.getElementById('image-stage');
    const traceImg = document.getElementById('trace-img');
    const presetSvg = document.getElementById('vector-preset');
    const presetSelect = document.getElementById('preset-select');

    const flipHBtn = document.getElementById('flip-h');
    const flipVBtn = document.getElementById('flip-v');
    const opacitySlider = document.getElementById('opacity-slider');
    const scaleSlider = document.getElementById('scale-slider');
    const lengthSlider = document.getElementById('length-slider');
    const widthSlider = document.getElementById('width-slider');

    const tabArt = document.getElementById('tab-art');
    const tabGuide = document.getElementById('tab-guide');
    const panelArt = document.getElementById('panel-art');
    const panelGuide = document.getElementById('panel-guide');

    let posX = 0, posY = 0;
    let startX = 0, startY = 0;
    let isDragging = false;
    let isFlippedH = false;
    let isFlippedV = false;
    let currentScale = 1;
    let isLocked = false;

    nailPath.setAttribute('d', NAIL_PATHS.almond);

    tabArt.addEventListener('click', () => {
      tabArt.classList.add('active');
      tabGuide.classList.remove('active');
      panelArt.style.display = 'flex';
      panelGuide.style.display = 'none';
    });

    tabGuide.addEventListener('click', () => {
      tabGuide.classList.add('active');
      tabArt.classList.remove('active');
      panelGuide.style.display = 'flex';
      panelArt.style.display = 'none';
    });

    themeBtn.addEventListener('click', () => {
      currentThemeIndex = (currentThemeIndex + 1) % THEMES.length;
      const theme = THEMES[currentThemeIndex];
      root.setAttribute('data-theme', theme.id);
      themeName.textContent = theme.label;
    });

    bgBtn.addEventListener('click', () => {
      stage.classList.toggle('dark-mode');
      const isDark = stage.classList.contains('dark-mode');
      bgLabel.textContent = isDark ? '☾ Dark' : '☼ Light';
    });

    shapeSelect.addEventListener('change', (e) => {
      const shape = e.target.value;
      if (shape === 'none') {
        nailSvg.style.display = 'none';
      } else {
        nailSvg.style.display = 'block';
        nailPath.setAttribute('d', NAIL_PATHS[shape]);
      }
    });

    lengthSlider.addEventListener('input', (e) => {
      guideWrapper.style.height = `${e.target.value}px`;
    });

    widthSlider.addEventListener('input', (e) => {
      guideWrapper.style.width = `${e.target.value}px`;
    });

    presetSelect.addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'none') {
        presetSvg.style.display = 'none';
        traceImg.style.display = 'none';
      } else if (val === 'stained_glass') {
        presetSvg.style.display = 'none';
        let attempt = 0;
        
        traceImg.onerror = () => {
          attempt++;
          if (attempt < STAINED_GLASS_SOURCES.length) {
            traceImg.src = STAINED_GLASS_SOURCES[attempt];
          }
        };

        traceImg.src = STAINED_GLASS_SOURCES[0];
        traceImg.style.display = 'block';
        resetTransforms();
      } else {
        traceImg.style.display = 'none';
        presetSvg.innerHTML = PRESETS[val] || '';
        presetSvg.style.display = 'block';
        resetTransforms();
      }
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          traceImg.src = event.target.result;
          traceImg.style.display = 'block';
          presetSvg.style.display = 'none';
          presetSelect.value = 'none';
          resetTransforms();
        };
        reader.readAsDataURL(file);
      }
    });

    function resetTransforms() {
      posX = 0;
      posY = 0;
      currentScale = 1;
      scaleSlider.value = 1;
      opacitySlider.value = 1;
      imgStage.style.opacity = 1;
      isFlippedH = false;
      isFlippedV = false;
      updateTransform();
    }

    function updateTransform() {
      const scaleX = isFlippedH ? -currentScale : currentScale;
      const scaleY = isFlippedV ? -currentScale : currentScale;
      imgStage.style.transform = `translate(${posX}px, ${posY}px) scale(${scaleX}, ${scaleY})`;
    }

    window.addEventListener('pointerdown', (e) => {
      if (isLocked || e.target.closest('#control-deck') || e.target.closest('header') || e.target.closest('#lock-banner')) return;
      isDragging = true;
      startX = e.clientX - posX;
      startY = e.clientY - posY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || isLocked) return;
      posX = e.clientX - startX;
      posY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('pointerup', () => isDragging = false);

    flipHBtn.addEventListener('click', () => {
      isFlippedH = !isFlippedH;
      updateTransform();
    });

    flipVBtn.addEventListener('click', () => {
      isFlippedV = !isFlippedV;
      updateTransform();
    });

    opacitySlider.addEventListener('input', (e) => {
      imgStage.style.opacity = e.target.value;
    });

    scaleSlider.addEventListener('input', (e) => {
      currentScale = parseFloat(e.target.value);
      updateTransform();
    });

    lockBtn.addEventListener('click', () => {
      isLocked = true;
      mainHeader.style.display = 'none';
      controlDeck.style.display = 'none';
      touchGuard.style.display = 'block';
      lockBanner.style.display = 'block';
    });

    unlockBtn.addEventListener('click', () => {
      isLocked = false;
      mainHeader.style.display = 'flex';
      controlDeck.style.display = 'flex';
      touchGuard.style.display = 'none';
      lockBanner.style.display = 'none';
    });
  </script>
</body>
</html>
