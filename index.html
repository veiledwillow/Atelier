<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Atelier Trace Studio</title>

  <link rel="manifest" href="manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* 1. EMERALD & GOLD */
    :root[data-theme="emerald"] {
      --bg-deep: #050d09;
      --bg-surface: #0a1711;
      --bg-surface-elevated: #0f2118;
      --border-soft: rgba(212, 175, 55, 0.22);
      --border-bright: rgba(212, 175, 55, 0.55);
      --accent-prime: #d4af37;
      --accent-glow: rgba(212, 175, 55, 0.35);
      --accent-gradient: linear-gradient(135deg, #f7e089 0%, #d4af37 50%, #aa8210 100%);
      --accent-text: #f9e7a2;
      --text-main: #f4f6f4;
      --text-muted: #8fa597;
      --glass-panel: rgba(10, 23, 17, 0.94);
      --guide-stroke: #d4af37;
      --canvas-light-bg: #ffffff;
      --scrim-fill: #ffffff;
      --select-arrow: url('data:image/svg+xml;utf8,<svg fill="%23d4af37" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      --btn-primary-text: #0d1a12;
    }

    /* 2. SAPPHIRE & COPPER */
    :root[data-theme="sapphire"] {
      --bg-deep: #050b16;
      --bg-surface: #0a1324;
      --bg-surface-elevated: #0f1c36;
      --border-soft: rgba(217, 131, 78, 0.25);
      --border-bright: rgba(217, 131, 78, 0.6);
      --accent-prime: #d9834e;
      --accent-glow: rgba(217, 131, 78, 0.35);
      --accent-gradient: linear-gradient(135deg, #f7aa7c 0%, #d9834e 50%, #9e4b1e 100%);
      --accent-text: #fddbc7;
      --text-main: #f0f4fc;
      --text-muted: #8294b5;
      --glass-panel: rgba(10, 19, 36, 0.94);
      --guide-stroke: #d9834e;
      --canvas-light-bg: #ffffff;
      --scrim-fill: #ffffff;
      --select-arrow: url('data:image/svg+xml;utf8,<svg fill="%23d9834e" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      --btn-primary-text: #07101f;
    }

    /* 3. OBSIDIAN & PLATINUM */
    :root[data-theme="obsidian"] {
      --bg-deep: #08090a;
      --bg-surface: #101216;
      --bg-surface-elevated: #1a1d23;
      --border-soft: rgba(226, 232, 240, 0.22);
      --border-bright: rgba(226, 232, 240, 0.55);
      --accent-prime: #e2e8f0;
      --accent-glow: rgba(226, 232, 240, 0.32);
      --accent-gradient: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
      --accent-text: #ffffff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-panel: rgba(16, 18, 22, 0.94);
      --guide-stroke: #cbd5e1;
      --canvas-light-bg: #ffffff;
      --scrim-fill: #ffffff;
      --select-arrow: url('data:image/svg+xml;utf8,<svg fill="%23cbd5e1" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      --btn-primary-text: #0b0f14;
    }

    /* 4. PLUM VELVET & ROSE GOLD */
    :root[data-theme="plum"] {
      --bg-deep: #0f050d;
      --bg-surface: #1a0a17;
      --bg-surface-elevated: #260e22;
      --border-soft: rgba(234, 160, 169, 0.25);
      --border-bright: rgba(234, 160, 169, 0.6);
      --accent-prime: #eaa0a9;
      --accent-glow: rgba(234, 160, 169, 0.35);
      --accent-gradient: linear-gradient(135deg, #fad0d6 0%, #eaa0a9 50%, #b86273 100%);
      --accent-text: #ffe4e8;
      --text-main: #fcf4f6;
      --text-muted: #b58d99;
      --glass-panel: rgba(26, 10, 23, 0.94);
      --guide-stroke: #eaa0a9;
      --canvas-light-bg: #ffffff;
      --scrim-fill: #ffffff;
      --select-arrow: url('data:image/svg+xml;utf8,<svg fill="%23eaa0a9" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      --btn-primary-text: #1d071a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    header {
      height: 50px;
      padding: 0 12px;
      background: var(--glass-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-soft);
      color: var(--text-muted);
      height: 32px;
      padding: 0 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover, .icon-btn.active {
      color: var(--accent-text);
      border-color: var(--accent-prime);
      background: rgba(255, 255, 255, 0.08);
    }

    .icon-btn.lock-accent {
      background: var(--accent-gradient);
      color: var(--btn-primary-text);
      border: none;
      font-weight: 700;
      box-shadow: 0 2px 8px var(--accent-glow);
      padding: 0 10px;
    }

    #stage-container {
      flex: 1;
      position: relative;
      background: var(--canvas-light-bg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease;
    }

    #stage-container.dark-mode {
      background: #000000;
    }

    /* ARTWORK LAYER */
    #image-stage {
      position: absolute;
      touch-action: none;
      cursor: grab;
      transform-origin: center center;
      z-index: 5;
    }

    #trace-img {
      display: none;
      max-width: 320px;
      pointer-events: none;
    }

    /* INTEGRATED SPOTLIGHT + OUTLINE RIG */
    #spotlight-rig {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
    }

    #scrim-surface {
      fill: var(--scrim-fill);
      opacity: 0.78;
      transition: fill 0.3s ease;
    }

    #stage-container.dark-mode #scrim-surface {
      fill: #000000;
    }

    #guide-outline-path {
      stroke: var(--guide-stroke);
      stroke-width: 2.2;
      stroke-dasharray: 4 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.3s ease;
      filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.35));
    }

    #touch-guard {
      display: none;
      position: absolute;
      inset: 0;
      background: transparent;
      z-index: 50;
    }

    #lock-banner {
      display: none;
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 60;
    }

    #unlock-btn {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--accent-prime);
      color: var(--accent-text);
      box-shadow: 0 8px 24px var(--accent-glow);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #control-deck {
      background: var(--glass-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-soft);
      padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 30;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.4);
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr 1.65fr 0.95fr 0.95fr;
      gap: 6px;
    }

    .btn {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-soft);
      height: 36px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      white-space: nowrap;
      padding: 0 4px;
      transition: all 0.2s ease;
    }

    .btn:active {
      transform: scale(0.97);
      border-color: var(--accent-prime);
    }

    select.btn {
      appearance: none;
      -webkit-appearance: none;
      padding: 0 16px 0 6px;
      background-image: var(--select-arrow);
      background-repeat: no-repeat;
      background-position: right 4px center;
      text-align-last: center;
    }

    .slider-tabs {
      display: flex;
      gap: 8px;
      padding: 2px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      border: 1px solid var(--border-soft);
    }

    .tab-btn {
      flex: 1;
      height: 26px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--bg-surface-elevated);
      color: var(--accent-text);
      border: 1px solid var(--accent-prime);
    }

    .slider-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      border: 1px solid var(--border-soft);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      min-width: 62px;
    }

    input[type="range"] {
      flex: 1;
      height: 28px;
      background: transparent;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: var(--accent-gradient);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      margin-top: -8px;
      border: 2px solid var(--bg-deep);
    }

    input[type="range"]::-moz-range-track {
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
    }

    input[type="range"]::-moz-range-thumb {
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: var(--accent-gradient);
      border: 2px solid var(--bg-deep);
    }

    @media (orientation: landscape) and (max-height: 500px) {
      header { height: 40px; padding: 0 10px; }
      .brand-title { font-size: 11px; }
      .icon-btn { height: 26px; padding: 0 6px; font-size: 10px; }
      #control-deck { padding: 4px 10px calc(4px + env(safe-area-inset-bottom)); gap: 4px; }
      .btn { height: 30px; font-size: 10px; }
      .tab-btn { height: 22px; font-size: 9px; }
      .slider-panel { padding: 4px 8px; gap: 4px; }
      .slider-row { gap: 6px; }
      input[type="range"] { height: 22px; }
    }
  </style>
</head>
<body>

  <header id="main-header">
    <div class="brand-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      Atelier Trace
    </div>

    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle" title="Cycle Palette">
        <span id="theme-name">✦ Emerald</span>
      </button>

      <button class="icon-btn" id="bg-toggle" title="Light / Dark Stage">
        <span id="bg-label">☼ Light</span>
      </button>

      <button class="icon-btn lock-accent" id="lock-btn">
        🔒 Lock
      </button>
    </div>
  </header>

  <main id="stage-container">
    <div id="touch-guard"></div>

    <div id="lock-banner">
      <button id="unlock-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        Studio Locked • Tap to Release
      </button>
    </div>

    <!-- ARTWORK REFERENCE -->
    <div id="image-stage">
      <img id="trace-img" src="" alt="Trace reference" crossorigin="anonymous" />
    </div>

    <!-- SYNCHRONIZED SPOTLIGHT & OUTLINE RIG -->
    <svg id="spotlight-rig" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <mask id="scrim-mask">
          <rect width="100%" height="100%" fill="white" />
          <path id="mask-cutout" d="" fill="black" />
        </mask>
      </defs>

      <!-- The Dimmed Background Scrim -->
      <rect id="scrim-surface" width="100%" height="100%" mask="url(#scrim-mask)" />

      <!-- The Gold Dashed Outline (Always 100% matched to cutout) -->
      <path id="guide-outline-path" d="" />
    </svg>
  </main>

  <footer id="control-deck">
    <div class="button-grid">
      <label class="btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:2px;">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        Load
        <input type="file" id="file-input" accept="image/*" style="display:none;" />
      </label>

      <select id="shape-select" class="btn">
        <option value="almond">Almond</option>
        <option value="coffin">Coffin</option>
        <option value="stiletto">Stiletto</option>
        <option value="square">Square</option>
        <option value="squoval">Squoval</option>
        <option value="oval">Oval</option>
        <option value="none">No Guide</option>
      </select>

      <select id="preset-select" class="btn">
        <option value="none">Flash Sheets...</option>
        <option value="lines-french.png">French & Lines</option>
        <option value="lace-mesh.png">Lace & Mesh</option>
        <option value="gothic-romance.png">Gothic Romance</option>
        <option value="celestial.png">Esoteric Celestial</option>
        <option value="baroque-filigree.png">Baroque Filigree</option>
        <option value="botanicals.png">Fine Botanicals</option>
      </select>

      <button class="btn" id="flip-h" title="Flip Horizontal">↔ Flip</button>
      <button class="btn" id="flip-v" title="Flip Vertical">↕ Invert</button>
    </div>

    <div class="slider-tabs">
      <button class="tab-btn active" id="tab-art">Artwork Sliders</button>
      <button class="tab-btn" id="tab-guide">Nail Guide Sliders</button>
    </div>

    <div class="slider-panel" id="panel-art">
      <div class="slider-row">
        <span class="slider-label">Zoom</span>
        <input type="range" id="scale-slider" min="0.1" max="6" step="0.05" value="1" />
      </div>
      <div class="slider-row">
        <span class="slider-label" id="rotate-label">Rotate 0°</span>
        <input type="range" id="rotate-slider" min="-180" max="180" step="1" value="0" />
      </div>
      <div class="slider-row">
        <span class="slider-label">Outside Dim</span>
        <input type="range" id="dim-slider" min="0" max="1" step="0.05" value="0.78" />
      </div>
    </div>

    <div class="slider-panel" id="panel-guide" style="display: none;">
      <div class="slider-row">
        <span class="slider-label">Length</span>
        <input type="range" id="length-slider" min="70" max="480" step="5" value="260" />
      </div>
      <div class="slider-row">
        <span class="slider-label">Width</span>
        <input type="range" id="width-slider" min="35" max="280" step="2" value="140" />
      </div>
    </div>
  </footer>

  <script>
    const NAIL_PATHS_BASE = {
      almond: "M 20,165 C 20,185 80,185 80,165 C 80,115 72,55 50,10 C 28,55 20,115 20,165 Z",
      coffin: "M 20,165 C 20,185 80,185 80,165 C 80,110 74,45 64,12 L 36,12 C 26,45 20,110 20,165 Z",
      stiletto: "M 20,165 C 20,185 80,185 80,165 C 80,105 68,45 50,4 C 32,45 20,105 20,165 Z",
      square: "M 18,165 C 18,185 82,185 82,165 L 82,12 L 18,12 Z",
      squoval: "M 20,165 C 20,185 80,185 80,165 L 80,24 C 80,12 68,12 50,12 C 32,12 20,12 20,24 Z",
      oval: "M 20,165 C 20,185 80,185 80,165 C 80,95 80,12 50,12 C 20,12 20,95 20,165 Z"
    };

    const THEMES = [
      { id: 'emerald', label: '✦ Emerald' },
      { id: 'sapphire', label: '✦ Sapphire' },
      { id: 'obsidian', label: '✦ Obsidian' },
      { id: 'plum', label: '✦ Plum' }
    ];
    let currentThemeIndex = 0;

    const root = document.documentElement;
    const themeBtn = document.getElementById('theme-toggle');
    const themeName = document.getElementById('theme-name');
    const bgBtn = document.getElementById('bg-toggle');
    const bgLabel = document.getElementById('bg-label');
    const stage = document.getElementById('stage-container');
    const touchGuard = document.getElementById('touch-guard');
    const lockBanner = document.getElementById('lock-banner');
    const lockBtn = document.getElementById('lock-btn');
    const unlockBtn = document.getElementById('unlock-btn');
    const mainHeader = document.getElementById('main-header');
    const controlDeck = document.getElementById('control-deck');

    const spotlightRig = document.getElementById('spotlight-rig');
    const scrimSurface = document.getElementById('scrim-surface');
    const maskCutout = document.getElementById('mask-cutout');
    const guideOutlinePath = document.getElementById('guide-outline-path');
    const shapeSelect = document.getElementById('shape-select');

    const fileInput = document.getElementById('file-input');
    const imgStage = document.getElementById('image-stage');
    const traceImg = document.getElementById('trace-img');
    const presetSelect = document.getElementById('preset-select');

    const flipHBtn = document.getElementById('flip-h');
    const flipVBtn = document.getElementById('flip-v');
    const scaleSlider = document.getElementById('scale-slider');
    const rotateSlider = document.getElementById('rotate-slider');
    const rotateLabel = document.getElementById('rotate-label');
    const dimSlider = document.getElementById('dim-slider');
    const lengthSlider = document.getElementById('length-slider');
    const widthSlider = document.getElementById('width-slider');

    const tabArt = document.getElementById('tab-art');
    const tabGuide = document.getElementById('tab-guide');
    const panelArt = document.getElementById('panel-art');
    const panelGuide = document.getElementById('panel-guide');

    let posX = 0, posY = 0;
    let startX = 0, startY = 0;
    let isDragging = false;
    let isFlippedH = false;
    let isFlippedV = false;
    let currentScale = 1;
    let currentRotation = 0;
    let isLocked = false;

    let guideW = 140;
    let guideH = 260;
    let currentShape = 'almond';

    // Synchronize both spotlight hole and gold outline together
    function updateRigGeometry() {
      if (currentShape === 'none') {
        spotlightRig.style.display = 'none';
        return;
      }
      spotlightRig.style.display = 'block';

      const rect = stage.getBoundingClientRect();
      const originX = rect.width / 2;
      const originY = rect.height / 2;

      // Base viewBox reference is 100 x 190
      const sx = guideW / 100;
      const sy = guideH / 190;
      const tx = originX - (guideW / 2);
      const ty = originY - (guideH / 2);

      const rawPath = NAIL_PATHS_BASE[currentShape];
      const transformAttr = `translate(${tx}, ${ty}) scale(${sx}, ${sy})`;

      maskCutout.setAttribute('d', rawPath);
      maskCutout.setAttribute('transform', transformAttr);

      guideOutlinePath.setAttribute('d', rawPath);
      guideOutlinePath.setAttribute('transform', transformAttr);
    }

    window.addEventListener('resize', updateRigGeometry);
    setTimeout(updateRigGeometry, 40);

    tabArt.addEventListener('click', () => {
      tabArt.classList.add('active');
      tabGuide.classList.remove('active');
      panelArt.style.display = 'flex';
      panelGuide.style.display = 'none';
    });

    tabGuide.addEventListener('click', () => {
      tabGuide.classList.add('active');
      tabArt.classList.remove('active');
      panelGuide.style.display = 'flex';
      panelArt.style.display = 'none';
    });

    themeBtn.addEventListener('click', () => {
      currentThemeIndex = (currentThemeIndex + 1) % THEMES.length;
      const theme = THEMES[currentThemeIndex];
      root.setAttribute('data-theme', theme.id);
      themeName.textContent = theme.label;
    });

    bgBtn.addEventListener('click', () => {
      stage.classList.toggle('dark-mode');
      const isDark = stage.classList.contains('dark-mode');
      bgLabel.textContent = isDark ? '☾ Dark' : '☼ Light';
    });

    shapeSelect.addEventListener('change', (e) => {
      currentShape = e.target.value;
      updateRigGeometry();
    });

    lengthSlider.addEventListener('input', (e) => {
      guideH = parseInt(e.target.value, 10);
      updateRigGeometry();
    });

    widthSlider.addEventListener('input', (e) => {
      guideW = parseInt(e.target.value, 10);
      updateRigGeometry();
    });

    presetSelect.addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'none') {
        traceImg.style.display = 'none';
      } else {
        traceImg.src = './' + val;
        traceImg.style.display = 'block';
        resetTransforms();
      }
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          traceImg.src = event.target.result;
          traceImg.style.display = 'block';
          presetSelect.value = 'none';
          resetTransforms();
        };
        reader.readAsDataURL(file);
      }
    });

    function resetTransforms() {
      posX = 0;
      posY = 0;
      currentScale = 1;
      currentRotation = 0;
      scaleSlider.value = 1;
      rotateSlider.value = 0;
      rotateLabel.textContent = 'Rotate 0°';
      isFlippedH = false;
      isFlippedV = false;
      updateTransform();
    }

    function updateTransform() {
      const scaleX = isFlippedH ? -currentScale : currentScale;
      const scaleY = isFlippedV ? -currentScale : currentScale;
      imgStage.style.transform = `translate(${posX}px, ${posY}px) rotate(${currentRotation}deg) scale(${scaleX}, ${scaleY})`;
    }

    window.addEventListener('pointerdown', (e) => {
      if (isLocked || e.target.closest('#control-deck') || e.target.closest('header') || e.target.closest('#lock-banner')) return;
      isDragging = true;
      startX = e.clientX - posX;
      startY = e.clientY - posY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || isLocked) return;
      posX = e.clientX - startX;
      posY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('pointerup', () => isDragging = false);

    flipHBtn.addEventListener('click', () => {
      isFlippedH = !isFlippedH;
      updateTransform();
    });

    flipVBtn.addEventListener('click', () => {
      isFlippedV = !isFlippedV;
      updateTransform();
    });

    scaleSlider.addEventListener('input', (e) => {
      currentScale = parseFloat(e.target.value);
      updateTransform();
    });

    rotateSlider.addEventListener('input', (e) => {
      currentRotation = parseInt(e.target.value, 10);
      rotateLabel.textContent = `Rotate ${currentRotation}°`;
      updateTransform();
    });

    dimSlider.addEventListener('input', (e) => {
      scrimSurface.style.opacity = e.target.value;
    });

    lockBtn.addEventListener('click', () => {
      isLocked = true;
      mainHeader.style.display = 'none';
      controlDeck.style.display = 'none';
      touchGuard.style.display = 'block';
      lockBanner.style.display = 'block';
    });

    unlockBtn.addEventListener('click', () => {
      isLocked = false;
      mainHeader.style.display = 'flex';
      controlDeck.style.display = 'flex';
      touchGuard.style.display = 'none';
      lockBanner.style.display = 'none';
    });
  </script>
</body>
</html>
